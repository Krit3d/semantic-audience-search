<section id="tasks" style="background: #F5F4F8">

    <div onMouseEnter="{{ tHoverOn }}" onMouseLeave="{{ tHoverOff }}" style="display: flex; flex-wrap: wrap; gap: 16px">
      <div class="task-tile" style="{{ tileStyle }}">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 16px">
          <span class="task-num" style="font-family: 'Oswald', 'Arial Narrow', sans-serif; font-weight: 600; font-size: clamp(96px, 10vw, 168px); line-height: 0.9; letter-spacing: -0.02em">{{ cur.n }}</span>
          <span style="font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 13px; letter-spacing: 0.08em; opacity: 0.7">/ 08</span>
        </div>
        <div style="display: flex; flex-direction: column; gap: 18px">
          <span style="display: block; width: 100%; height: 3px; border-radius: 3px; overflow: hidden"><span onAnimationEnd="{{ nextTask }}" style="{{ tBarStyle }}"></span></span>
          <span style="font-size: clamp(24px, 2.1vw, 34px); line-height: 1.2; font-weight: 600; letter-spacing: -0.02em; text-wrap: balance">{{ cur.full }}</span>
        </div>
      </div>

      <div class="drum" style="order: -1; flex: 1.6 1 520px; min-width: 0; position: relative; height: var(--drum-h, 560px); background: #15131F; border-radius: 28px; overflow: hidden">
        <div style="{{ drumStyle }}">
          <sc-for list="{{ tasks }}" as="t" hint-placeholder-count="8">
            <button type="button" onMouseEnter="{{ t.pick }}" onFocus="{{ t.pick }}" onClick="{{ t.pick }}" aria-pressed="{{ t.on }}" style="{{ t.style }}">
              <span style="{{ t.textStyle }}">{{ t.short }}</span>
            </button>
          </sc-for>
        </div>
        <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 120px; background: linear-gradient(#15131F, rgba(21,19,31,0)); pointer-events: none"></div>
        <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 120px; background: linear-gradient(rgba(21,19,31,0), #15131F); pointer-events: none"></div>
      </div>
    </div>
  </div>
</section>
