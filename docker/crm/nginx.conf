server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    location = /crm {
        return 301 /crm/;
    }

    location ^~ /crm/ {
        rewrite ^/crm/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    # Keep edge limits aligned with the API's webhook (1 MiB) and upload (20 MiB)
    # limits; do not let a slow client hold an upstream connection indefinitely.
    location ~ ^/api/v1/crm/webhooks/(inbound|bridgit)$ {
        client_max_body_size 1m;
        client_body_timeout 30s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        set $api_backend http://api:8000;
        proxy_pass $api_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(api/|docs$|redoc$|openapi\.json$|media/) {
        set $api_backend http://api:8000;
        proxy_pass $api_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v1/crm/upload {
        client_max_body_size 20m;
        client_body_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        set $api_backend http://api:8000;
        proxy_pass $api_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
